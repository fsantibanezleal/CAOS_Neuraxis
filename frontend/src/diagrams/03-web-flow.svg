<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 455" role="img"><title>From actual files to verified outputs / De un caso a consecuencias inspeccionables</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.bx-web{fill:var(--color-accent-soft);stroke:var(--color-accent)}.bx-eng{stroke:var(--color-accent-2)}.bx-gate{stroke:var(--color-warn)}.bx-store{stroke:var(--color-magenta)}text{font-family:var(--font-sans);fill:var(--color-fg)}.ttl{font-size:12.5px;font-weight:600}.mono{font-family:var(--font-mono);font-size:9.5px;fill:var(--color-fg-subtle)}.items{font-size:10.5px}.sub{font-size:10px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.label{font-size:9.5px;fill:var(--color-fg-faint)}.head{font-size:17px;font-weight:650}</style><defs><marker id="03-web-flow-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--color-accent)"/></marker></defs><text class="head l-en" x="20" y="32">From actual files to verified outputs</text><text class="head l-es" x="20" y="32">De un caso a consecuencias inspeccionables</text><text class="sub l-en" x="20" y="53">Explicit responsibilities, observable transitions and declared limits</text><text class="sub l-es" x="20" y="53">Responsabilidades explícitas, transiciones observables y límites</text><g><rect class="bx bx-web" x="20" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="101">Select files and task</text><text class="ttl l-es" x="34" y="101">Configurar caso</text><text class="mono l-neutral" x="34" y="124">UTF-8 / relative paths</text><text class="items l-en" x="34" y="153">source / data / release</text><text class="items l-es" x="34" y="153">código / datos / entrega</text><text class="sub l-en" x="34" y="179">owned incident or your files</text><text class="sub l-es" x="34" y="179">incidente propio o tus archivos</text><text class="label l-neutral" x="34" y="198">01</text></g><g><rect class="bx bx-web" x="306" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="101">Run native actions</text><text class="ttl l-es" x="320" y="101">Ejecutar acciones nativas</text><text class="mono l-neutral" x="320" y="124">reflexmesh Controller</text><text class="items l-en" x="320" y="153">dependency-ready registered tools</text><text class="items l-es" x="320" y="153">herramientas con dependencias listas</text><text class="sub l-en" x="320" y="179">bounded and cancellable</text><text class="sub l-es" x="320" y="179">ciclo finito, inicialmente pausado</text><text class="label l-neutral" x="320" y="198">02</text></g><g><rect class="bx bx-gate" x="592" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="101">Independent verification</text><text class="ttl l-es" x="606" y="101">Verificación independiente</text><text class="mono l-neutral" x="606" y="124">input bytes / output receipts</text><text class="items l-en" x="606" y="153">hashes and row conservation</text><text class="items l-es" x="606" y="153">hashes y conservación de filas</text><text class="sub l-en" x="606" y="179">observed results, including faults</text><text class="sub l-es" x="606" y="179">semánticas temporales distintas</text><text class="label l-neutral" x="606" y="198">03</text></g><g><rect class="bx bx-web" x="20" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="285">Inspect findings</text><text class="ttl l-es" x="34" y="285">Inspeccionar hallazgos</text><text class="mono l-neutral" x="34" y="308">src/components/Instruments.tsx</text><text class="items l-en" x="34" y="337">file and original line</text><text class="items l-es" x="34" y="337">índice de evento + tiempo de fuente</text><text class="sub l-en" x="34" y="363">keyboard + pointer readouts</text><text class="sub l-es" x="34" y="363">lecturas por teclado y puntero</text><text class="label l-neutral" x="34" y="382">04</text></g><g><rect class="bx bx-eng" x="306" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="285">Review generated outputs</text><text class="ttl l-es" x="320" y="285">Revisar salidas generadas</text><text class="mono l-neutral" x="320" y="308">src/components/Instruments.tsx</text><text class="items l-en" x="320" y="337">accepted CSV / manifest / journal</text><text class="items l-es" x="320" y="337">CSV aceptado / manifiesto / diario</text><text class="sub l-en" x="320" y="363">missing values stay missing</text><text class="sub l-es" x="320" y="363">las ausencias permanecen ausentes</text><text class="label l-neutral" x="320" y="382">05</text></g><g><rect class="bx bx-store" x="592" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="285">Download and delete</text><text class="ttl l-es" x="606" y="285">Descargar y eliminar</text><text class="mono l-neutral" x="606" y="308">src/api/artifacts.ts</text><text class="items l-en" x="606" y="337">originals + outputs + provenance</text><text class="items l-es" x="606" y="337">originales + salidas + procedencia</text><text class="sub l-en" x="606" y="363">one-hour hosted retention</text><text class="sub l-es" x="606" y="363">importar no ejecuta herramientas</text><text class="label l-neutral" x="606" y="382">06</text></g><path class="flow" d="M286,144 L304,144" marker-end="url(#03-web-flow-arrow)"/><path class="flow" d="M572,144 L590,144" marker-end="url(#03-web-flow-arrow)"/><path class="flow" d="M724,210 L724,238 L152,238 L152,258" marker-end="url(#03-web-flow-arrow)"/><path class="flow" d="M286,328 L304,328" marker-end="url(#03-web-flow-arrow)"/><path class="flow" d="M572,328 L590,328" marker-end="url(#03-web-flow-arrow)"/><text class="sub l-en" x="20" y="432">Recorded evidence flows forward; new effects require fresh admission</text><text class="sub l-es" x="20" y="432">La evidencia avanza; los efectos nuevos requieren admisión vigente</text></svg>