<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 455" role="img"><title>A persistent software-control loop / Un ciclo persistente de control</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.bx-web{fill:var(--color-accent-soft);stroke:var(--color-accent)}.bx-eng{stroke:var(--color-accent-2)}.bx-gate{stroke:var(--color-warn)}.bx-store{stroke:var(--color-magenta)}text{font-family:var(--font-sans);fill:var(--color-fg)}.ttl{font-size:12.5px;font-weight:600}.mono{font-family:var(--font-mono);font-size:9.5px;fill:var(--color-fg-subtle)}.items{font-size:10.5px}.sub{font-size:10px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.label{font-size:9.5px;fill:var(--color-fg-faint)}.head{font-size:17px;font-weight:650}</style><defs><marker id="01-the-app-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--color-accent)"/></marker></defs><text class="head l-en" x="20" y="32">A persistent software-control loop</text><text class="head l-es" x="20" y="32">Un ciclo persistente de control</text><text class="sub l-en" x="20" y="53">Explicit responsibilities, observable transitions and declared limits</text><text class="sub l-es" x="20" y="53">Responsabilidades explícitas, transiciones observables y límites</text><g><rect class="bx bx-web" x="20" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="101">Observed workspace</text><text class="ttl l-es" x="34" y="101">Entorno observado</text><text class="mono l-neutral" x="34" y="124">reflexmesh/environments/software.py</text><text class="items l-en" x="34" y="153">files / processes / local HTTP</text><text class="items l-es" x="34" y="153">archivos / procesos / HTTP local</text><text class="sub l-en" x="34" y="179">archived observations</text><text class="sub l-es" x="34" y="179">observaciones registradas</text><text class="label l-neutral" x="34" y="198">01</text></g><g><rect class="bx bx-eng" x="306" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="101">Causal state</text><text class="ttl l-es" x="320" y="101">Estado causal</text><text class="mono l-neutral" x="320" y="124">reflexmesh/controller.py</text><text class="items l-en" x="320" y="153">resource revisions + pending effects</text><text class="items l-es" x="320" y="153">revisiones + efectos pendientes</text><text class="sub l-en" x="320" y="179">no evaluator-only truth</text><text class="sub l-es" x="320" y="179">sin verdad exclusiva del evaluador</text><text class="label l-neutral" x="320" y="198">02</text></g><g><rect class="bx bx-eng" x="592" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="101">Policy selection</text><text class="ttl l-es" x="606" y="101">Selección de política</text><text class="mono l-neutral" x="606" y="124">reflexmesh/policies/</text><text class="items l-en" x="606" y="153">M01 ... M12; act / wait / delegate</text><text class="items l-es" x="606" y="153">M01 ... M12; actuar / esperar / delegar</text><text class="sub l-en" x="606" y="179">typed proposals only</text><text class="sub l-es" x="606" y="179">solo propuestas tipadas</text><text class="label l-neutral" x="606" y="198">03</text></g><g><rect class="bx bx-gate" x="20" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="285">Admission broker</text><text class="ttl l-es" x="34" y="285">Ejecutor con guardas</text><text class="mono l-neutral" x="34" y="308">rust/core.rs</text><text class="items l-en" x="34" y="337">capability + revision + cancellation</text><text class="items l-es" x="34" y="337">capacidad + revisión + cancelación</text><text class="sub l-en" x="34" y="363">recheck before effects</text><text class="sub l-es" x="34" y="363">verificar antes de efectos</text><text class="label l-neutral" x="34" y="382">04</text></g><g><rect class="bx bx-gate" x="306" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="285">Effect supervision</text><text class="ttl l-es" x="320" y="285">Supervisión de efectos</text><text class="mono l-neutral" x="320" y="308">reflexmesh/effectors.py</text><text class="items l-en" x="320" y="337">registered arguments; verify outcome</text><text class="items l-es" x="320" y="337">argumentos registrados; verificar efecto</text><text class="sub l-en" x="320" y="363">unknown is not success</text><text class="sub l-es" x="320" y="363">desconocido no es éxito</text><text class="label l-neutral" x="320" y="382">05</text></g><g><rect class="bx bx-store" x="592" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="285">Evidence and UI</text><text class="ttl l-es" x="606" y="285">Evidencia e interfaz</text><text class="mono l-neutral" x="606" y="308">src/pages/Workbench.tsx</text><text class="items l-en" x="606" y="337">timeline + resources + predictions</text><text class="items l-es" x="606" y="337">cronología + recursos + predicciones</text><text class="sub l-en" x="606" y="363">selected-case readouts</text><text class="sub l-es" x="606" y="363">lecturas del caso seleccionado</text><text class="label l-neutral" x="606" y="382">06</text></g><path class="flow" d="M286,144 L304,144" marker-end="url(#01-the-app-arrow)"/><path class="flow" d="M572,144 L590,144" marker-end="url(#01-the-app-arrow)"/><path class="flow" d="M724,210 L724,238 L152,238 L152,258" marker-end="url(#01-the-app-arrow)"/><path class="flow" d="M286,328 L304,328" marker-end="url(#01-the-app-arrow)"/><path class="flow" d="M572,328 L590,328" marker-end="url(#01-the-app-arrow)"/><text class="sub l-en" x="20" y="432">Recorded evidence flows forward; new effects require fresh admission</text><text class="sub l-es" x="20" y="432">La evidencia avanza; los efectos nuevos requieren admisión vigente</text></svg>