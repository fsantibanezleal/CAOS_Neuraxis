<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 455" role="img"><title>Typed runtime records and immutable evidence / Registros tipados y evidencia inmutable</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.bx-web{fill:var(--color-accent-soft);stroke:var(--color-accent)}.bx-eng{stroke:var(--color-accent-2)}.bx-gate{stroke:var(--color-warn)}.bx-store{stroke:var(--color-magenta)}text{font-family:var(--font-sans);fill:var(--color-fg)}.ttl{font-size:12.5px;font-weight:600}.mono{font-family:var(--font-mono);font-size:9.5px;fill:var(--color-fg-subtle)}.items{font-size:10.5px}.sub{font-size:10px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.label{font-size:9.5px;fill:var(--color-fg-faint)}.head{font-size:17px;font-weight:650}</style><defs><marker id="05-data-contracts-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--color-accent)"/></marker></defs><text class="head l-en" x="20" y="32">Typed runtime records and immutable evidence</text><text class="head l-es" x="20" y="32">Registros tipados y evidencia inmutable</text><text class="sub l-en" x="20" y="53">Explicit responsibilities, observable transitions and declared limits</text><text class="sub l-es" x="20" y="53">Responsabilidades explícitas, transiciones observables y límites</text><g><rect class="bx bx-store" x="20" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="101">Observation</text><text class="ttl l-es" x="34" y="101">Observación</text><text class="mono l-neutral" x="34" y="124">reflexmesh/contracts.py</text><text class="items l-en" x="34" y="153">event + goal + revision + history</text><text class="items l-es" x="34" y="153">evento + objetivo + revisión + historial</text><text class="sub l-en" x="34" y="179">candidates + capabilities</text><text class="sub l-es" x="34" y="179">candidatos + capacidades</text><text class="label l-neutral" x="34" y="198">01</text></g><g><rect class="bx bx-eng" x="306" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="101">Candidate</text><text class="ttl l-es" x="320" y="101">Candidato</text><text class="mono l-neutral" x="320" y="124">reflexmesh/contracts.py</text><text class="items l-en" x="320" y="153">tool + arguments + required authority</text><text class="items l-es" x="320" y="153">herramienta + argumentos + autoridad</text><text class="sub l-en" x="320" y="179">bound resource versions</text><text class="sub l-es" x="320" y="179">versiones de recursos vinculadas</text><text class="label l-neutral" x="320" y="198">02</text></g><g><rect class="bx bx-eng" x="592" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="101">Decision</text><text class="ttl l-es" x="606" y="101">Decisión</text><text class="mono l-neutral" x="606" y="124">reflexmesh/contracts.py</text><text class="items l-en" x="606" y="153">candidate / mode / score / reason</text><text class="items l-es" x="606" y="153">candidato / modo / puntaje / motivo</text><text class="sub l-en" x="606" y="179">scores do not grant authority</text><text class="sub l-es" x="606" y="179">puntajes no conceden autoridad</text><text class="label l-neutral" x="606" y="198">03</text></g><g><rect class="bx bx-gate" x="20" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="285">Outcome</text><text class="ttl l-es" x="34" y="285">Resultado</text><text class="mono l-neutral" x="34" y="308">reflexmesh/contracts.py</text><text class="items l-en" x="34" y="337">observed effects + status + duration</text><text class="items l-es" x="34" y="337">efectos + estado + duración</text><text class="sub l-en" x="34" y="363">unknown / cancelled / verified</text><text class="sub l-es" x="34" y="363">desconocido / cancelado / verificado</text><text class="label l-neutral" x="34" y="382">04</text></g><g><rect class="bx bx-store" x="306" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="285">Episode</text><text class="ttl l-es" x="320" y="285">Episodio</text><text class="mono l-neutral" x="320" y="308">episodes/&lt;run_id&gt;.json</text><text class="items l-en" x="320" y="337">decisions + metrics + lane + seed</text><text class="items l-es" x="320" y="337">decisiones + métricas + modo + semilla</text><text class="sub l-en" x="320" y="363">source and model lineage</text><text class="sub l-es" x="320" y="363">procedencia de código y modelo</text><text class="label l-neutral" x="320" y="382">05</text></g><g><rect class="bx bx-web" x="592" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="285">Manifest</text><text class="ttl l-es" x="606" y="285">Manifiesto</text><text class="mono l-neutral" x="606" y="308">data/derived/index.json</text><text class="items l-en" x="606" y="337">coverage + hashes + aggregate results</text><text class="items l-es" x="606" y="337">cobertura + hashes + resultados</text><text class="sub l-en" x="606" y="363">descriptive uncertainty labeled</text><text class="sub l-es" x="606" y="363">incertidumbre descriptiva etiquetada</text><text class="label l-neutral" x="606" y="382">06</text></g><path class="flow" d="M286,144 L304,144" marker-end="url(#05-data-contracts-arrow)"/><path class="flow" d="M572,144 L590,144" marker-end="url(#05-data-contracts-arrow)"/><path class="flow" d="M724,210 L724,238 L152,238 L152,258" marker-end="url(#05-data-contracts-arrow)"/><path class="flow" d="M286,328 L304,328" marker-end="url(#05-data-contracts-arrow)"/><path class="flow" d="M572,328 L590,328" marker-end="url(#05-data-contracts-arrow)"/><text class="sub l-en" x="20" y="432">Recorded evidence flows forward; new effects require fresh admission</text><text class="sub l-es" x="20" y="432">La evidencia avanza; los efectos nuevos requieren admisión vigente</text></svg>