<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 525" role="img"><title>Typed proposals, guarded effects and auditable outcomes / Propuestas tipadas, efectos protegidos y resultados auditables</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.band{fill:var(--color-surface-2);fill-opacity:.48;stroke:var(--color-border);stroke-width:1}.card{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.left{stroke:var(--color-accent-2)}.right{stroke:var(--color-accent)}.title{font-family:var(--font-sans);font-size:16px;font-weight:700;fill:var(--color-fg)}.sub{font-family:var(--font-sans);font-size:10px;fill:var(--color-fg-subtle)}.lane{font-family:var(--font-sans);font-size:8.5px;font-weight:700;letter-spacing:.8px;fill:var(--color-fg-subtle)}.ttl{font-family:var(--font-sans);font-size:12px;font-weight:650;fill:var(--color-fg)}.path{font-family:var(--font-mono);font-size:9px;fill:var(--color-fg-subtle)}.detail{font-family:var(--font-sans);font-size:9.5px;fill:var(--color-fg)}.mu{font-family:var(--font-sans);font-size:9px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.lbl{font-family:var(--font-sans);font-size:8.5px;font-weight:650;fill:var(--color-fg-faint);paint-order:stroke;stroke:var(--color-surface-2);stroke-width:4px;stroke-linejoin:round}</style><defs><marker id="arr-05-data-contracts" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="var(--color-accent)"/></marker></defs><text class="title l-en" x="20" y="27">Typed proposals, guarded effects and auditable outcomes</text><text class="title l-es" x="20" y="27">Propuestas tipadas, efectos protegidos y resultados auditables</text><text class="sub l-en" x="20" y="46">Every transition preserves identity, authority and resource-version evidence</text><text class="sub l-es" x="20" y="46">Cada transición conserva identidad, autoridad y versión del recurso</text><rect class="band" x="10" y="63" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="76">OBSERVATION AND PROPOSAL</text><text class="lane l-es" x="22" y="76">OBSERVACIÓN Y PROPUESTA</text><rect class="card left" x="20" y="87" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="108">Observation</text><text class="ttl l-es" x="32" y="108">Observación</text><text class="path" x="32" y="128">reflexmesh==0.1.2 · Observation</text><text class="detail l-en" x="32" y="152">goal · event · history · revisions</text><text class="detail l-es" x="32" y="152">objetivo · evento · historial · revisiones</text><text class="mu l-en" x="32" y="175">history is causal input, not hidden authority</text><text class="mu l-es" x="32" y="175">el historial es contexto, no autoridad</text><rect class="card right" x="600" y="87" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="108">Candidate</text><text class="ttl l-es" x="612" y="108">Candidato</text><text class="path" x="612" y="128">reflexmesh==0.1.2 · Candidate</text><text class="detail l-en" x="612" y="152">tool + args + capability + resource versions</text><text class="detail l-es" x="612" y="152">herramienta + args + permiso + versiones</text><text class="mu l-en" x="612" y="175">stale resource versions invalidate a proposal</text><text class="mu l-es" x="612" y="175">una versión obsoleta invalida la propuesta</text><path class="flow" d="M280,141 L596,141" marker-end="url(#arr-05-data-contracts)"/><text class="lbl l-en" text-anchor="middle" x="438" y="134">observed affordance</text><text class="lbl l-es" text-anchor="middle" x="438" y="134">posibilidad observada</text><rect class="band" x="10" y="214" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="227">DECISION AND ADMISSION</text><text class="lane l-es" x="22" y="227">DECISIÓN Y ADMISIÓN</text><rect class="card left" x="20" y="238" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="259">Decision</text><text class="ttl l-es" x="32" y="259">Decisión</text><text class="path" x="32" y="279">reflexmesh==0.1.2 · Decision</text><text class="detail l-en" x="32" y="303">candidate · mode · score · reason</text><text class="detail l-es" x="32" y="303">candidato · modo · puntaje · motivo</text><text class="mu l-en" x="32" y="326">scores and reasons are explanatory metadata</text><text class="mu l-es" x="32" y="326">puntajes y motivos son metadatos</text><rect class="card right" x="600" y="238" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="259">Broker admission</text><text class="ttl l-es" x="612" y="259">Admisión del intermediario</text><text class="path" x="612" y="279">reflexmesh==0.1.2 · Rust core · broker</text><text class="detail l-en" x="612" y="303">recheck capability + revision before effect</text><text class="detail l-es" x="612" y="303">revalidar permiso + revisión</text><text class="mu l-en" x="612" y="326">admission rechecks the current revision</text><text class="mu l-es" x="612" y="326">la admisión verifica la revisión vigente</text><path class="flow" d="M280,292 L596,292" marker-end="url(#arr-05-data-contracts)"/><text class="lbl l-en" text-anchor="middle" x="438" y="285">typed action request</text><text class="lbl l-es" text-anchor="middle" x="438" y="285">solicitud tipada</text><rect class="band" x="10" y="365" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="378">OUTCOME AND IMMUTABLE RECORD</text><text class="lane l-es" x="22" y="378">RESULTADO Y REGISTRO INMUTABLE</text><rect class="card left" x="20" y="389" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="410">Outcome receipt</text><text class="ttl l-es" x="32" y="410">Recibo del resultado</text><text class="path" x="32" y="430">reflexmesh==0.1.2 · Outcome</text><text class="detail l-en" x="32" y="454">observed state · status · duration · receipt</text><text class="detail l-es" x="32" y="454">estado observado · estado · duración · recibo</text><text class="mu l-en" x="32" y="477">unknown is never coerced to success</text><text class="mu l-es" x="32" y="477">lo desconocido nunca cuenta como éxito</text><rect class="card right" x="600" y="389" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="410">Episode manifest</text><text class="ttl l-es" x="612" y="410">Manifiesto del episodio</text><text class="path" x="612" y="430">data/derived/index.json</text><text class="detail l-en" x="612" y="454">seed · split · hashes · metrics · provenance</text><text class="detail l-es" x="612" y="454">semilla · partición · hashes · métricas</text><text class="mu l-en" x="612" y="477">hashes bind results to source and method</text><text class="mu l-es" x="612" y="477">los hashes vinculan resultado, código y método</text><path class="flow" d="M280,443 L596,443" marker-end="url(#arr-05-data-contracts)"/><text class="lbl l-en" text-anchor="middle" x="438" y="436">effect receipt</text><text class="lbl l-es" text-anchor="middle" x="438" y="436">recibo del efecto</text></svg>