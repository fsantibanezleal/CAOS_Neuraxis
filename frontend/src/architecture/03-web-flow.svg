<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 680" role="img">
  <title>From a task choice to inspectable consequences / De elegir una tarea a revisar sus consecuencias</title>
  <style>
    svg .l-es{display:none} svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}
    .lane{fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.2}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.4}
    .bx-hi{fill:var(--color-accent-soft);stroke:var(--color-accent);stroke-width:1.9}.bx-eng{stroke:var(--color-good);stroke-width:1.7}
    .bx-gate{fill:var(--color-accent-soft);stroke:var(--color-warn);stroke-width:1.8}.bx-store{stroke:var(--color-accent-2);stroke-width:1.7}
    text{font-family:var(--font-sans);fill:var(--color-fg)}.head{font-size:18px;font-weight:700}.band{font-size:11px;font-weight:700;letter-spacing:.07em;fill:var(--color-fg-subtle)}
    .sub{font-size:11px;fill:var(--color-fg-subtle)}.ttl{font-size:13px;font-weight:650}.it{font-size:11.5px}.cd,.mono{font-family:var(--font-mono);font-size:10px;fill:var(--color-accent)}
    .mu{font-size:10.5px;fill:var(--color-fg-subtle)}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.7}.flow-hi{stroke:var(--color-accent)}
    .lbl{font-size:10px;fill:var(--color-fg-subtle)}
  </style>
  <defs><marker id="web-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-accent)"/></marker></defs>
  <text class="head l-en" x="24" y="34">A run stays inspectable from request to final outcome</text><text class="head l-es" x="24" y="34">Cada ejecución se puede inspeccionar desde la solicitud al resultado</text>
  <text class="mu l-en" x="24" y="57">The operator chooses the case and lane; every transition keeps its source, state and verification evidence.</text>
  <text class="mu l-es" x="24" y="57">El operador elige caso y modo; cada transición conserva fuente, estado y evidencia de verificación.</text>
  <rect class="lane" x="18" y="78" width="844" height="202" rx="12"/><text class="band l-en" x="34" y="103">REQUEST AND CONTROL</text><text class="band l-es" x="34" y="103">SOLICITUD Y CONTROL</text>
  <g><rect class="bx bx-hi" x="34" y="120" width="248" height="128" rx="9"/><text class="ttl l-en" x="49" y="146">Choose task and inputs</text><text class="ttl l-es" x="49" y="146">Elegir tarea y entradas</text><text class="cd l-neutral" x="49" y="168">data/operations/ · Workspace.tsx</text><text class="it l-en" x="49" y="194">source · CSV · release bundle</text><text class="it l-es" x="49" y="194">código · CSV · paquete de entrega</text><text class="mu l-en" x="49" y="222">Selected files remain operator-owned</text><text class="mu l-es" x="49" y="222">Los archivos siguen bajo control del operador</text></g>
  <g><rect class="bx bx-eng" x="316" y="120" width="248" height="128" rx="9"/><text class="ttl l-en" x="331" y="146">Advance one bounded step</text><text class="ttl l-es" x="331" y="146">Avanzar un paso acotado</text><text class="cd l-neutral" x="331" y="168">services/operations.py</text><text class="it l-en" x="331" y="194">dependency · deadline · cancellation</text><text class="it l-es" x="331" y="194">dependencia · plazo · cancelación</text><text class="mu l-en" x="331" y="222">Pause or stop stays available</text><text class="mu l-es" x="331" y="222">Pausar y detener siguen disponibles</text></g>
  <g><rect class="bx bx-gate" x="598" y="120" width="248" height="128" rx="9"/><text class="ttl l-en" x="613" y="146">Dispatch to the chosen lane</text><text class="ttl l-es" x="613" y="146">Enviar al modo elegido</text><text class="cd l-neutral" x="613" y="168">simulator.ts · operations_api.py</text><text class="it l-en" x="613" y="194">virtual replay or authenticated native</text><text class="it l-es" x="613" y="194">reproducción virtual o ejecución nativa</text><text class="mu l-en" x="613" y="222">Modes keep separate provenance</text><text class="mu l-es" x="613" y="222">Cada modo conserva su procedencia</text></g>
  <path class="flow flow-hi" d="M282 184 H312" marker-end="url(#web-flow)"/><text class="lbl l-en" x="284" y="112">validated request</text><text class="lbl l-es" x="284" y="112">solicitud validada</text>
  <path class="flow" d="M564 184 H594" marker-end="url(#web-flow)"/><text class="lbl l-en" x="564" y="112">admissible step</text><text class="lbl l-es" x="564" y="112">paso permitido</text>

  <rect class="lane" x="18" y="298" width="844" height="202" rx="12"/><text class="band l-en" x="34" y="323">OBSERVE, VERIFY, RETAIN</text><text class="band l-es" x="34" y="323">OBSERVAR, VERIFICAR Y CONSERVAR</text>
  <g><rect class="bx bx-store" x="34" y="340" width="248" height="128" rx="9"/><text class="ttl l-en" x="49" y="366">Inspect at the source</text><text class="ttl l-es" x="49" y="366">Inspeccionar en su origen</text><text class="cd l-neutral" x="49" y="388">components/Instruments.tsx</text><text class="it l-en" x="49" y="414">file · line · resource · decision</text><text class="it l-es" x="49" y="414">archivo · línea · recurso · decisión</text><text class="mu l-en" x="49" y="442">Missing evidence is shown as missing</text><text class="mu l-es" x="49" y="442">La evidencia ausente se identifica</text></g>
  <g><rect class="bx bx-eng" x="316" y="340" width="248" height="128" rx="9"/><text class="ttl l-en" x="331" y="366">Check independent outcomes</text><text class="ttl l-es" x="331" y="366">Verificar resultados</text><text class="cd l-neutral" x="331" y="388">evaluation/ · operations.py</text><text class="it l-en" x="331" y="414">postcondition · receipt · status</text><text class="it l-es" x="331" y="414">postcondición · recibo · estado</text><text class="mu l-en" x="331" y="442">Unresolved is not a pass</text><text class="mu l-es" x="331" y="442">Sin resolver no equivale a aprobar</text></g>
  <g><rect class="bx" x="598" y="340" width="248" height="128" rx="9"/><text class="ttl l-en" x="613" y="366">Review or export evidence</text><text class="ttl l-es" x="613" y="366">Revisar o exportar evidencia</text><text class="cd l-neutral" x="613" y="388">operations_api.py · artifacts.ts</text><text class="it l-en" x="613" y="414">download · reconcile · delete run</text><text class="it l-es" x="613" y="414">descargar · conciliar · borrar</text><text class="mu l-en" x="613" y="442">No replay redispatches a tool</text><text class="mu l-es" x="613" y="442">Reproducir no vuelve a ejecutar herramientas</text></g>
  <path class="flow" d="M722 248 V336" marker-end="url(#web-flow)"/><text class="lbl l-en" x="733" y="293">events + outputs</text><text class="lbl l-es" x="733" y="293">eventos + salidas</text>
  <path class="flow" d="M598 404 H568" marker-end="url(#web-flow)"/><text class="lbl l-en" x="568" y="332">evidence</text><text class="lbl l-es" x="568" y="332">evidencia</text>
  <path class="flow flow-hi" d="M316 404 H286" marker-end="url(#web-flow)"/><text class="lbl l-en" x="286" y="332">verified state</text><text class="lbl l-es" x="286" y="332">estado verificado</text>

  <rect class="bx" x="34" y="528" width="812" height="74" rx="9"/>
  <text class="ttl l-en" x="52" y="554">The user remains in control</text><text class="ttl l-es" x="52" y="554">El operador conserva el control</text>
  <text class="it l-en" x="52" y="580">Review the proposed action, observe the effect, then keep or remove the run and its exported record.</text>
  <text class="it l-es" x="52" y="580">Revisar la acción, observar el efecto y conservar o eliminar la ejecución y su registro exportado.</text>
  <text class="mu l-en" x="34" y="627">All controls remain keyboard-operable; source citations and artifact lineage stay attached to the visible section.</text>
  <text class="mu l-es" x="34" y="627">Los controles admiten teclado; las fuentes y la procedencia permanecen junto a la sección visible.</text>
</svg>
