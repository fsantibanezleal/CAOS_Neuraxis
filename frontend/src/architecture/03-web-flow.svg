<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 525" role="img"><title>A run from user request through cleanup / Una ejecución desde la solicitud hasta la eliminación</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.band{fill:var(--color-surface-2);fill-opacity:.48;stroke:var(--color-border);stroke-width:1}.card{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.left{stroke:var(--color-accent-2)}.right{stroke:var(--color-accent)}.title{font-family:var(--font-sans);font-size:16px;font-weight:700;fill:var(--color-fg)}.sub{font-family:var(--font-sans);font-size:10px;fill:var(--color-fg-subtle)}.lane{font-family:var(--font-sans);font-size:8.5px;font-weight:700;letter-spacing:.8px;fill:var(--color-fg-subtle)}.ttl{font-family:var(--font-sans);font-size:12px;font-weight:650;fill:var(--color-fg)}.path{font-family:var(--font-mono);font-size:9px;fill:var(--color-fg-subtle)}.detail{font-family:var(--font-sans);font-size:9.5px;fill:var(--color-fg)}.mu{font-family:var(--font-sans);font-size:9px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.lbl{font-family:var(--font-sans);font-size:8.5px;font-weight:650;fill:var(--color-fg-faint);paint-order:stroke;stroke:var(--color-surface-2);stroke-width:4px;stroke-linejoin:round}</style><defs><marker id="arr-03-web-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="var(--color-accent)"/></marker></defs><text class="title l-en" x="20" y="27">A run from user request through cleanup</text><text class="title l-es" x="20" y="27">Una ejecución desde la solicitud hasta la eliminación</text><text class="sub l-en" x="20" y="46">The route names match the same-origin Operations API</text><text class="sub l-es" x="20" y="46">Las rutas corresponden a la API de operaciones del mismo origen</text><rect class="band" x="10" y="63" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="76">INPUT AND AUTHENTICATION</text><text class="lane l-es" x="22" y="76">ENTRADA Y AUTENTICACIÓN</text><rect class="card left" x="20" y="87" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="108">Choose task and files</text><text class="ttl l-es" x="32" y="108">Elegir tarea y archivos</text><text class="path" x="32" y="128">frontend/src/lib/operations.ts</text><text class="detail l-en" x="32" y="152">text inputs · registered task id</text><text class="detail l-es" x="32" y="152">entradas de texto · tarea registrada</text><text class="mu l-en" x="32" y="175">the browser never sends arbitrary shell commands</text><text class="mu l-es" x="32" y="175">el navegador no envía comandos arbitrarios</text><rect class="card right" x="600" y="87" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="108">Create scoped session</text><text class="ttl l-es" x="612" y="108">Crear sesión acotada</text><text class="path" x="612" y="128">POST /operations-api/session</text><text class="detail l-en" x="612" y="152">same-origin bearer token</text><text class="detail l-es" x="612" y="152">token bearer del mismo origen</text><text class="mu l-en" x="612" y="175">the session token is not a user password</text><text class="mu l-es" x="612" y="175">el token no es la contraseña del usuario</text><path class="flow" d="M280,141 L596,141" marker-end="url(#arr-03-web-flow)"/><text class="lbl l-en" text-anchor="middle" x="438" y="134">task + file bytes</text><text class="lbl l-es" text-anchor="middle" x="438" y="134">tarea + archivos</text><rect class="band" x="10" y="214" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="227">EXECUTION AND INSPECTION</text><text class="lane l-es" x="22" y="227">EJECUCIÓN E INSPECCIÓN</text><rect class="card left" x="20" y="238" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="259">Start bounded run</text><text class="ttl l-es" x="32" y="259">Iniciar ejecución acotada</text><text class="path" x="32" y="279">POST /operations-api/runs</text><text class="detail l-en" x="32" y="303">fixed tools · dependency-aware schedule</text><text class="detail l-es" x="32" y="303">herramientas fijas · dependencias</text><text class="mu l-en" x="32" y="326">runs use registered operations and bounded inputs</text><text class="mu l-es" x="32" y="326">usa operaciones registradas y entradas acotadas</text><rect class="card right" x="600" y="238" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="259">Inspect run</text><text class="ttl l-es" x="612" y="259">Inspeccionar ejecución</text><text class="path" x="612" y="279">GET /operations-api/runs/{id}</text><text class="detail l-en" x="612" y="303">status · findings · resource revisions</text><text class="detail l-es" x="612" y="303">estado · hallazgos · revisiones</text><text class="mu l-en" x="612" y="326">cancellation and observed completion are distinct</text><text class="mu l-es" x="612" y="326">cancelación y término observado son distintos</text><path class="flow" d="M280,292 L596,292" marker-end="url(#arr-03-web-flow)"/><text class="lbl l-en" text-anchor="middle" x="438" y="285">run id + state events</text><text class="lbl l-es" text-anchor="middle" x="438" y="285">id + eventos de estado</text><rect class="band" x="10" y="365" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="378">OUTCOME AND RETENTION</text><text class="lane l-es" x="22" y="378">RESULTADO Y RETENCIÓN</text><rect class="card left" x="20" y="389" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="410">Export evidence</text><text class="ttl l-es" x="32" y="410">Exportar evidencia</text><text class="path" x="32" y="430">GET /operations-api/runs/{id}/export</text><text class="detail l-en" x="32" y="454">receipts · hashes · accepted/rejected rows</text><text class="detail l-es" x="32" y="454">recibos · hashes · filas aceptadas/rechazadas</text><text class="mu l-en" x="32" y="477">export does not rerun the operation</text><text class="mu l-es" x="32" y="477">exportar no vuelve a ejecutar la operación</text><rect class="card right" x="600" y="389" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="410">Cancel or delete</text><text class="ttl l-es" x="612" y="410">Cancelar o borrar</text><text class="path" x="612" y="430">POST /operations-api/runs/{id}/cancel · DELETE /runs/{id}</text><text class="detail l-en" x="612" y="454">cancellation differs from retention cleanup</text><text class="detail l-es" x="612" y="454">cancelar difiere de borrar</text><text class="mu l-en" x="612" y="477">deletion removes the selected run artifacts</text><text class="mu l-es" x="612" y="477">borrar elimina los artefactos de la ejecución</text><path class="flow" d="M280,443 L596,443" marker-end="url(#arr-03-web-flow)"/><text class="lbl l-en" text-anchor="middle" x="438" y="436">verified result</text><text class="lbl l-es" text-anchor="middle" x="438" y="436">resultado verificado</text></svg>