<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 525" role="img"><title>Live execution, replay and fitting have separate boundaries / Ejecución real, reproducción y ajuste tienen límites separados</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.band{fill:var(--color-surface-2);fill-opacity:.48;stroke:var(--color-border);stroke-width:1}.card{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.left{stroke:var(--color-accent-2)}.right{stroke:var(--color-accent)}.title{font-family:var(--font-sans);font-size:16px;font-weight:700;fill:var(--color-fg)}.sub{font-family:var(--font-sans);font-size:10px;fill:var(--color-fg-subtle)}.lane{font-family:var(--font-sans);font-size:8.5px;font-weight:700;letter-spacing:.8px;fill:var(--color-fg-subtle)}.ttl{font-family:var(--font-sans);font-size:12px;font-weight:650;fill:var(--color-fg)}.path{font-family:var(--font-mono);font-size:9px;fill:var(--color-fg-subtle)}.detail{font-family:var(--font-sans);font-size:9.5px;fill:var(--color-fg)}.mu{font-family:var(--font-sans);font-size:9px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.lbl{font-family:var(--font-sans);font-size:8.5px;font-weight:650;fill:var(--color-fg-faint);paint-order:stroke;stroke:var(--color-surface-2);stroke-width:4px;stroke-linejoin:round}</style><defs><marker id="arr-02-lanes" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="var(--color-accent)"/></marker></defs><text class="title l-en" x="20" y="27">Live execution, replay and fitting have separate boundaries</text><text class="title l-es" x="20" y="27">Ejecución real, reproducción y ajuste tienen límites separados</text><text class="sub l-en" x="20" y="46">State and authority do not leak between these three lanes</text><text class="sub l-es" x="20" y="46">El estado y la autoridad no se comparten entre estas tres vías</text><rect class="band" x="10" y="63" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="76">LIVE USER WORKSPACE</text><text class="lane l-es" x="22" y="76">ESPACIO REAL DEL USUARIO</text><rect class="card left" x="20" y="87" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="108">Task setup</text><text class="ttl l-es" x="32" y="108">Preparar tarea</text><text class="path" x="32" y="128">app/operations_api.py</text><text class="detail l-en" x="32" y="152">registered checks · bounded text files</text><text class="detail l-es" x="32" y="152">validadores registrados · archivos acotados</text><text class="mu l-en" x="32" y="175">runs are scoped to the authenticated session</text><text class="mu l-es" x="32" y="175">las ejecuciones quedan ligadas a la sesión</text><rect class="card right" x="600" y="87" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="108">Native run</text><text class="ttl l-es" x="612" y="108">Ejecución nativa</text><text class="path" x="612" y="128">app/main.py · reflexmesh==0.1.2</text><text class="detail l-en" x="612" y="152">capability checks · cancellable effects</text><text class="detail l-es" x="612" y="152">permisos · efectos cancelables</text><text class="mu l-en" x="612" y="175">a policy cannot widen registered capabilities</text><text class="mu l-es" x="612" y="175">una política no amplía capacidades registradas</text><path class="flow" d="M280,141 L596,141" marker-end="url(#arr-02-lanes)"/><text class="lbl l-en" text-anchor="middle" x="438" y="134">request + scoped authority</text><text class="lbl l-es" text-anchor="middle" x="438" y="134">solicitud + autoridad acotada</text><rect class="band" x="10" y="214" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="227">MEASURED REPLAY</text><text class="lane l-es" x="22" y="227">REPRODUCCIÓN MEDIDA</text><rect class="card left" x="20" y="238" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="259">Frozen episodes</text><text class="ttl l-es" x="32" y="259">Episodios congelados</text><text class="path" x="32" y="279">data/derived/index.json</text><text class="detail l-en" x="32" y="303">hash-pinned observations and outcomes</text><text class="detail l-es" x="32" y="303">observaciones y resultados con hash</text><text class="mu l-en" x="32" y="326">outputs retain receipts and cleanup controls</text><text class="mu l-es" x="32" y="326">las salidas conservan recibos y borrado</text><rect class="card right" x="600" y="238" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="259">Comparison runner</text><text class="ttl l-es" x="612" y="259">Motor de comparación</text><text class="path" x="612" y="279">data-pipeline/pipeline/runner.py</text><text class="detail l-en" x="612" y="303">replay records; never redispatch effects</text><text class="detail l-es" x="612" y="303">reproduce registros; no repite efectos</text><text class="mu l-en" x="612" y="326">replay reads canonical records only</text><text class="mu l-es" x="612" y="326">la reproducción lee registros canónicos</text><path class="flow" d="M280,292 L596,292" marker-end="url(#arr-02-lanes)"/><text class="lbl l-en" text-anchor="middle" x="438" y="285">episodes + predicates</text><text class="lbl l-es" text-anchor="middle" x="438" y="285">episodios + predicados</text><rect class="band" x="10" y="365" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="378">OFFLINE COMPUTATION</text><text class="lane l-es" x="22" y="378">CÓMPUTO FUERA DE LÍNEA</text><rect class="card left" x="20" y="389" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="410">Fit and calibrate</text><text class="ttl l-es" x="32" y="410">Ajustar y calibrar</text><text class="path" x="32" y="430">data-pipeline/pipeline/runner.py</text><text class="detail l-en" x="32" y="454">group splits · calibration · export</text><text class="detail l-es" x="32" y="454">particiones · calibración · exportación</text><text class="mu l-en" x="32" y="477">held-out runs preserve invalid and failed outcomes</text><text class="mu l-es" x="32" y="477">las pruebas conservan inválidos y fallidos</text><rect class="card right" x="600" y="389" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="410">Frozen policy artifact</text><text class="ttl l-es" x="612" y="410">Política congelada</text><text class="path" x="612" y="430">models/ · data/derived/</text><text class="detail l-en" x="612" y="454">versioned artifact consumed explicitly</text><text class="detail l-es" x="612" y="454">artefacto versionado de uso explícito</text><text class="mu l-en" x="612" y="477">training does not execute during browser sessions</text><text class="mu l-es" x="612" y="477">el entrenamiento no corre en el navegador</text><path class="flow" d="M280,443 L596,443" marker-end="url(#arr-02-lanes)"/><text class="lbl l-en" text-anchor="middle" x="438" y="436">labels + training data</text><text class="lbl l-es" text-anchor="middle" x="438" y="436">etiquetas + datos</text></svg>