<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 525" role="img"><title>M12 mechanism and results, with the negative evidence / Mecanismo M12 y resultados, incluida la evidencia negativa</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.band{fill:var(--color-surface-2);fill-opacity:.48;stroke:var(--color-border);stroke-width:1}.card{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.left{stroke:var(--color-accent-2)}.right{stroke:var(--color-accent)}.title{font-family:var(--font-sans);font-size:16px;font-weight:700;fill:var(--color-fg)}.sub{font-family:var(--font-sans);font-size:10px;fill:var(--color-fg-subtle)}.lane{font-family:var(--font-sans);font-size:8.5px;font-weight:700;letter-spacing:.8px;fill:var(--color-fg-subtle)}.ttl{font-family:var(--font-sans);font-size:12px;font-weight:650;fill:var(--color-fg)}.path{font-family:var(--font-mono);font-size:9px;fill:var(--color-fg-subtle)}.detail{font-family:var(--font-sans);font-size:9.5px;fill:var(--color-fg)}.mu{font-family:var(--font-sans);font-size:9px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.lbl{font-family:var(--font-sans);font-size:8.5px;font-weight:650;fill:var(--color-fg-faint);paint-order:stroke;stroke:var(--color-surface-2);stroke-width:4px;stroke-linejoin:round}</style><defs><marker id="arr-04-the-science" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="var(--color-accent)"/></marker></defs><text class="title l-en" x="20" y="27">M12 mechanism and results, with the negative evidence</text><text class="title l-es" x="20" y="27">Mecanismo M12 y resultados, incluida la evidencia negativa</text><text class="sub l-en" x="20" y="46">Current measurements do not demonstrate an advantage over a guarded state machine</text><text class="sub l-es" x="20" y="46">Las mediciones actuales no demuestran ventaja ante una máquina con guardas</text><rect class="band" x="10" y="63" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="76">ADMISSIBILITY AND FAST POLICY</text><text class="lane l-es" x="22" y="76">ADMISIBILIDAD Y POLÍTICA RÁPIDA</text><rect class="card left" x="20" y="87" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="108">Admissible set</text><text class="ttl l-es" x="32" y="108">Conjunto admisible</text><text class="path" x="32" y="128">Aₜ = {a : contract(a,oₜ)}</text><text class="detail l-en" x="32" y="152">capability + current resource version</text><text class="detail l-es" x="32" y="152">permiso + versión vigente del recurso</text><text class="mu l-en" x="32" y="175">the contract filter runs before scoring</text><text class="mu l-es" x="32" y="175">el contrato filtra antes de puntuar</text><rect class="card right" x="600" y="87" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="108">Action score</text><text class="ttl l-es" x="612" y="108">Puntaje de acción</text><text class="path" x="612" y="128">Sₜ(a)=log pθ(a|oₜ,hₜ)+λUφ(a)</text><text class="detail l-en" x="612" y="152">ranks actions; score grants no authority</text><text class="detail l-es" x="612" y="152">ordena; el puntaje no concede permiso</text><text class="mu l-en" x="612" y="175">the score is not an authorization check</text><text class="mu l-es" x="612" y="175">el puntaje no autoriza acciones</text><path class="flow" d="M280,141 L596,141" marker-end="url(#arr-04-the-science)"/><text class="lbl l-en" text-anchor="middle" x="438" y="134">admissible actions</text><text class="lbl l-es" text-anchor="middle" x="438" y="134">acciones admisibles</text><rect class="band" x="10" y="214" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="227">DELIBERATION GATE AND CORE RESULT</text><text class="lane l-es" x="22" y="227">UMBRAL DE DELIBERACIÓN Y RESULTADO</text><rect class="card left" x="20" y="238" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="259">Expected handoff value</text><text class="ttl l-es" x="32" y="259">Valor esperado de delegar</text><text class="path" x="32" y="279">Δₜ(q)=E[R|q]−E[R|fast]−c(q)</text><text class="detail l-en" x="32" y="303">latency is part of c(q); fitted threshold 1.01</text><text class="detail l-es" x="32" y="303">latencia integra c(q); umbral ajustado 1,01</text><text class="mu l-en" x="32" y="326">the selected gate threshold never defers</text><text class="mu l-es" x="32" y="326">el umbral elegido nunca delega</text><rect class="card right" x="600" y="238" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="259">Core benchmark</text><text class="ttl l-es" x="612" y="259">Prueba principal</text><text class="path l-en" x="612" y="279">M12: 1,160 / 1,200 (96.67%)</text><text class="path l-es" x="612" y="279">M12: 1.160 / 1.200 (96,67%)</text><text class="detail l-en" x="612" y="303">M01 guarded FSM: 1200 of 1200</text><text class="detail l-es" x="612" y="303">M01 máquina con guardas: 1200 de 1200</text><text class="mu l-en" x="612" y="326">M12 trails the exact guarded baseline</text><text class="mu l-es" x="612" y="326">M12 queda debajo de la referencia con guardas</text><path class="flow" d="M280,292 L596,292" marker-end="url(#arr-04-the-science)"/><text class="lbl l-en" text-anchor="middle" x="438" y="285">gate output</text><text class="lbl l-es" text-anchor="middle" x="438" y="285">salida del umbral</text><rect class="band" x="10" y="365" width="860" height="144" rx="10"/><text class="lane l-en" x="22" y="378">TRANSFER, ABLATIONS AND FAILURE MODE</text><text class="lane l-es" x="22" y="378">TRANSFERENCIA, ABLACIONES Y FALLOS</text><rect class="card left" x="20" y="389" width="260" height="108" rx="8"/><text class="ttl l-en" x="32" y="410">Held-out transfer</text><text class="ttl l-es" x="32" y="410">Transferencia reservada</text><text class="path" x="32" y="430">M04: 24/24 · M12: 21/24</text><text class="detail l-en" x="32" y="454">four ablations equal full M12 success</text><text class="detail l-es" x="32" y="454">cuatro ablaciones igualan éxito M12</text><text class="mu l-en" x="32" y="477">XGBoost is stronger on this transfer sample</text><text class="mu l-es" x="32" y="477">XGBoost supera a M12 en esta muestra</text><rect class="card right" x="600" y="389" width="260" height="108" rx="8"/><text class="ttl l-en" x="612" y="410">Failure concentration</text><text class="ttl l-es" x="612" y="410">Concentración de fallos</text><text class="path" x="612" y="430">40/40 M12 failures: long-job cancellation</text><text class="detail l-en" x="612" y="454">10 seeds repeat; no demonstrated gain</text><text class="detail l-es" x="612" y="454">10 semillas repiten; no hay ganancia</text><text class="mu l-en" x="612" y="477">all failures are cancellation cases</text><text class="mu l-es" x="612" y="477">todos los fallos son de cancelación</text><path class="flow" d="M280,443 L596,443" marker-end="url(#arr-04-the-science)"/><text class="lbl l-en" text-anchor="middle" x="438" y="436">new task composition</text><text class="lbl l-es" text-anchor="middle" x="438" y="436">nueva composición de tareas</text></svg>