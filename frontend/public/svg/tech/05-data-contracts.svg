<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 680" role="img">
  <title>Runtime contracts become versioned research evidence / Los contratos de ejecución forman evidencia versionada</title>
  <style>
    svg .l-es{display:none} svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}
    .lane{fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.2}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.4}
    .bx-hi{fill:var(--color-accent-soft);stroke:var(--color-accent);stroke-width:1.9}.bx-eng{stroke:var(--color-good);stroke-width:1.7}
    .bx-gate{fill:var(--color-accent-soft);stroke:var(--color-warn);stroke-width:1.8}.bx-store{stroke:var(--color-accent-2);stroke-width:1.7}
    text{font-family:var(--font-sans);fill:var(--color-fg)}.head{font-size:18px;font-weight:700}.band{font-size:11px;font-weight:700;letter-spacing:.07em;fill:var(--color-fg-subtle)}
    .sub{font-size:11px;fill:var(--color-fg-subtle)}.ttl{font-size:13px;font-weight:650}.it{font-size:11.5px}.cd,.mono{font-family:var(--font-mono);font-size:10px;fill:var(--color-accent)}
    .mu{font-size:10.5px;fill:var(--color-fg-subtle)}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.7}.flow-hi{stroke:var(--color-accent)}.lbl{font-size:10px;fill:var(--color-fg-subtle)}
  </style>
  <defs><marker id="contract-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-accent)"/></marker></defs>
  <text class="head l-en" x="24" y="34">Typed records carry authority and evidence separately</text><text class="head l-es" x="24" y="34">Los registros tipados separan autoridad y evidencia</text>
  <text class="mu l-en" x="24" y="57">A score is not permission; a receipt is not success; a missing outcome is not a pass.</text><text class="mu l-es" x="24" y="57">Un puntaje no es permiso; un recibo no prueba éxito; un resultado ausente no aprueba.</text>

  <rect class="lane" x="18" y="78" width="844" height="202" rx="12"/><text class="band l-en" x="34" y="103">LIVE ACTION CONTRACT</text><text class="band l-es" x="34" y="103">CONTRATO DE ACCIÓN EN EJECUCIÓN</text>
  <g><rect class="bx bx-hi" x="34" y="120" width="248" height="128" rx="9"/><text class="ttl l-en" x="49" y="146">Observation and candidates</text><text class="ttl l-es" x="49" y="146">Observación y candidatos</text><text class="cd l-neutral" x="49" y="168">reflexmesh/contracts.py</text><text class="it l-en" x="49" y="194">goal · revision · typed arguments</text><text class="it l-es" x="49" y="194">objetivo · revisión · argumentos</text><text class="mu l-en" x="49" y="222">Producer: environment adapters</text><text class="mu l-es" x="49" y="222">Productor: adaptadores de entorno</text></g>
  <g><rect class="bx bx-gate" x="316" y="120" width="248" height="128" rx="9"/><text class="ttl l-en" x="331" y="146">Decision and admission</text><text class="ttl l-es" x="331" y="146">Decisión y admisión</text><text class="cd l-neutral" x="331" y="168">controller.py · rust/core.rs</text><text class="it l-en" x="331" y="194">mode · action id · capability check</text><text class="it l-es" x="331" y="194">modo · acción · control de capacidad</text><text class="mu l-en" x="331" y="222">Broker rechecks current revisions</text><text class="mu l-es" x="331" y="222">El intermediario revalida revisiones</text></g>
  <g><rect class="bx bx-eng" x="598" y="120" width="248" height="128" rx="9"/><text class="ttl l-en" x="613" y="146">Outcome verification</text><text class="ttl l-es" x="613" y="146">Verificación de resultados</text><text class="cd l-neutral" x="613" y="168">evaluation/runner.py</text><text class="it l-en" x="613" y="194">postcondition · status · duration</text><text class="it l-es" x="613" y="194">postcondición · estado · duración</text><text class="mu l-en" x="613" y="222">Producer: independent predicate</text><text class="mu l-es" x="613" y="222">Productor: predicado independiente</text></g>
  <path class="flow flow-hi" d="M282 184 H312" marker-end="url(#contract-flow)"/><text class="lbl l-en" x="282" y="112">candidate set</text><text class="lbl l-es" x="282" y="112">candidatos</text>
  <path class="flow" d="M564 184 H594" marker-end="url(#contract-flow)"/><text class="lbl l-en" x="565" y="112">admitted effect</text><text class="lbl l-es" x="565" y="112">efecto admitido</text>

  <rect class="lane" x="18" y="298" width="844" height="202" rx="12"/><text class="band l-en" x="34" y="323">PERSIST, VALIDATE AND CONSUME</text><text class="band l-es" x="34" y="323">PERSISTIR, VALIDAR Y CONSUMIR</text>
  <g><rect class="bx bx-store" x="598" y="340" width="248" height="128" rx="9"/><text class="ttl l-en" x="613" y="366">Episode and lineage</text><text class="ttl l-es" x="613" y="366">Episodio y procedencia</text><text class="cd l-neutral" x="613" y="388">data/derived/episodes/*.json</text><text class="it l-en" x="613" y="414">events · decisions · metrics · hashes</text><text class="it l-es" x="613" y="414">eventos · decisiones · métricas · hashes</text><text class="mu l-en" x="613" y="442">One immutable run identity</text><text class="mu l-es" x="613" y="442">Identidad inmutable por ejecución</text></g>
    <g><rect class="bx" x="316" y="340" width="248" height="128" rx="9"/><text class="ttl l-en" x="331" y="366">Schemas and version history</text><text class="ttl l-es" x="331" y="366">Esquemas e historial de versiones</text><text class="cd l-neutral" x="331" y="388">docs/contracts/catalog.md</text><text class="it l-en" x="331" y="414">21 contracts · 20 JSON schemas</text><text class="it l-es" x="331" y="414">21 contratos · 20 esquemas JSON</text><text class="cd l-neutral" x="331" y="442">scripts/check_documents.py</text></g>
  <g><rect class="bx bx-hi" x="34" y="340" width="248" height="128" rx="9"/><text class="ttl l-en" x="49" y="366">Read-only consumers</text><text class="ttl l-es" x="49" y="366">Consumidores de solo lectura</text><text class="cd l-neutral" x="49" y="388">frontend/src/api/artifacts.ts</text><text class="it l-en" x="49" y="414">workbench · notebooks · manuscripts</text><text class="it l-es" x="49" y="414">banco · cuadernos · manuscritos</text><text class="mu l-en" x="49" y="442">Consumers cannot redispatch effects</text><text class="mu l-es" x="49" y="442">Los consumidores no repiten efectos</text></g>
  <path class="flow" d="M722 248 V336" marker-end="url(#contract-flow)"/><text class="lbl l-en" x="733" y="294">execution record</text><text class="lbl l-es" x="733" y="294">registro de ejecución</text>
  <path class="flow" d="M598 404 H568" marker-end="url(#contract-flow)"/><text class="lbl l-en" x="567" y="332">schema + revision</text><text class="lbl l-es" x="567" y="332">esquema + revisión</text>
  <path class="flow flow-hi" d="M316 404 H286" marker-end="url(#contract-flow)"/><text class="lbl l-en" x="286" y="332">validated artifacts</text><text class="lbl l-es" x="286" y="332">artefactos validados</text>

  <rect class="bx" x="34" y="528" width="812" height="78" rx="9"/><text class="ttl l-en" x="52" y="554">Missing or invalid data has an explicit path</text><text class="ttl l-es" x="52" y="554">Los datos ausentes o inválidos tienen una ruta explícita</text>
  <text class="it l-en" x="52" y="580">Reject schema errors; preserve unknown outcomes; never replace absence with zero, success or a guessed value.</text>
  <text class="it l-es" x="52" y="580">Rechazar esquemas inválidos; preservar resultados desconocidos; nunca sustituir ausencias por cero o éxito.</text>
  <text class="mu l-en" x="34" y="638">Schemas define producer, consumer, revision and missing-data behavior; catalog gates run on every release.</text>
  <text class="mu l-es" x="34" y="638">Los esquemas declaran productor, consumidor, revisión y datos ausentes; sus controles corren en cada versión.</text>
</svg>
