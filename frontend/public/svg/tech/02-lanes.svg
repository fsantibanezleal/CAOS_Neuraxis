<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 720" role="img">
  <title>Three execution lanes and their evidence boundaries / Tres modos de ejecución y sus límites de evidencia</title>
  <style>
    svg .l-es{display:none} svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}
    .lane{fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.2}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.4}
    .bx-hi{fill:var(--color-accent-soft);stroke:var(--color-accent);stroke-width:1.8}.bx-eng{stroke:var(--color-good);stroke-width:1.7}
    .bx-gate{fill:var(--color-accent-soft);stroke:var(--color-warn);stroke-width:1.8}.bx-store{stroke:var(--color-accent-2);stroke-width:1.7}
    text{font-family:var(--font-sans);fill:var(--color-fg)}.head{font-size:18px;font-weight:700}.lane-title{font-size:12px;font-weight:700;letter-spacing:.07em}
    .sub{font-size:11px;fill:var(--color-fg-subtle)}.ttl{font-size:13px;font-weight:650}.it{font-size:11.5px}.cd,.mono{font-family:var(--font-mono);font-size:10px;fill:var(--color-accent)}
    .mu{font-size:10.5px;fill:var(--color-fg-subtle)}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.6}.flow-hi{stroke:var(--color-accent)}
    .lbl{font-size:10px;fill:var(--color-fg-subtle)}
  </style>
  <defs><marker id="lanes-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-accent)"/></marker></defs>
  <text class="head l-en" x="24" y="34">Three execution lanes, one honest evidence boundary</text><text class="head l-es" x="24" y="34">Tres modos de ejecución y un límite honesto de evidencia</text>
  <text class="mu l-en" x="24" y="57">Static replay is read-only; native actions are authenticated; fitting and evaluation stay offline.</text>
  <text class="mu l-es" x="24" y="57">La reproducción estática es de solo lectura; las acciones nativas requieren autenticación; el ajuste y la evaluación son locales.</text>

  <rect class="lane" x="18" y="78" width="844" height="166" rx="12"/>
  <text class="lane-title l-en" x="34" y="103">PUBLIC · READ-ONLY RESEARCH EVIDENCE</text><text class="lane-title l-es" x="34" y="103">PÚBLICO · EVIDENCIA CIENTÍFICA DE SOLO LECTURA</text>
  <g><rect class="bx bx-hi" x="34" y="120" width="244" height="100" rx="8"/><text class="ttl l-en" x="48" y="145">Research workbench</text><text class="ttl l-es" x="48" y="145">Banco de investigación</text><text class="cd l-neutral" x="48" y="165">frontend/src/api/artifacts.ts</text><text class="it l-en" x="48" y="188">validates and replays; no effects</text><text class="it l-es" x="48" y="188">valida y reproduce; sin efectos</text><text class="mu l-en" x="48" y="207">SPA routes and linked evidence</text><text class="mu l-es" x="48" y="207">Rutas y evidencia vinculada</text></g>
  <g><rect class="bx bx-store" x="318" y="120" width="244" height="100" rx="8"/><text class="ttl l-en" x="332" y="145">Frozen artifact bundle</text><text class="ttl l-es" x="332" y="145">Paquete de artefactos congelado</text><text class="cd l-neutral" x="332" y="165">data/derived/index.json</text><text class="it l-en" x="332" y="188">episode hashes · lineage · metrics</text><text class="it l-es" x="332" y="188">hashes · procedencia · métricas</text><text class="mu l-en" x="332" y="207">Unknown outcomes stay unknown</text><text class="mu l-es" x="332" y="207">Resultados desconocidos siguen así</text></g>
  <g><rect class="bx" x="602" y="120" width="244" height="100" rx="8"/><text class="ttl l-en" x="616" y="145">Independent readers</text><text class="ttl l-es" x="616" y="145">Lectores independientes</text><text class="cd l-neutral" x="616" y="165">/introduction · /benchmark</text><text class="it l-en" x="616" y="188">compare methods and inspect sources</text><text class="it l-es" x="616" y="188">compara métodos y fuentes</text><text class="mu l-en" x="616" y="207">No API capability is exposed</text><text class="mu l-es" x="616" y="207">No expone capacidades de API</text></g>
  <path class="flow flow-hi" d="M278 169 H314" marker-end="url(#lanes-flow)"/><text class="lbl l-en" x="278" y="111">fetch + verify</text><text class="lbl l-es" x="278" y="111">cargar + verificar</text>
  <path class="flow" d="M562 169 H598" marker-end="url(#lanes-flow)"/><text class="lbl l-en" x="562" y="111">rendered measures</text><text class="lbl l-es" x="562" y="111">medidas renderizadas</text>

  <rect class="lane" x="18" y="260" width="844" height="184" rx="12"/>
  <text class="lane-title l-en" x="34" y="285">OPERATOR-OWNED · AUTHENTICATED NATIVE EFFECTS</text><text class="lane-title l-es" x="34" y="285">DEL OPERADOR · EFECTOS NATIVOS AUTENTICADOS</text>
  <g><rect class="bx bx-hi" x="30" y="302" width="194" height="116" rx="8"/><text class="ttl l-en" x="42" y="327">Local workbench</text><text class="ttl l-es" x="42" y="327">Banco local</text><text class="cd l-neutral" x="42" y="348">src/components/Workspace.tsx</text><text class="it l-en" x="42" y="373">chosen files · task · review</text><text class="it l-es" x="42" y="373">archivos · tarea · revisión</text><text class="mu l-en" x="42" y="398">Capability held in memory</text><text class="mu l-es" x="42" y="398">Capacidad solo en memoria</text></g>
  <g><rect class="bx" x="242" y="302" width="194" height="116" rx="8"/><text class="ttl l-en" x="254" y="327">Bounded local API</text><text class="ttl l-es" x="254" y="327">API local acotada</text><text class="cd l-neutral" x="254" y="348">app/operations_api.py</text><text class="it l-en" x="254" y="373">registered tasks · same origin</text><text class="it l-es" x="254" y="373">tareas registradas · mismo origen</text><text class="mu l-en" x="254" y="398">Public /api is disabled</text><text class="mu l-es" x="254" y="398">La ruta pública /api se desactiva</text></g>
  <g><rect class="bx bx-gate" x="454" y="302" width="194" height="116" rx="8"/><text class="ttl l-en" x="466" y="327">Native broker</text><text class="ttl l-es" x="466" y="327">Intermediario nativo</text><text class="cd l-neutral" x="466" y="348">runtime.py + rust/core.rs</text><text class="it l-en" x="466" y="373">capabilities · revision checks</text><text class="it l-es" x="466" y="373">capacidades · revisiones</text><text class="mu l-en" x="466" y="398">Real effects, explicit receipts</text><text class="mu l-es" x="466" y="398">Efectos reales y recibos</text></g>
  <g><rect class="bx bx-store" x="666" y="302" width="180" height="116" rx="8"/><text class="ttl l-en" x="678" y="327">User workspace</text><text class="ttl l-es" x="678" y="327">Espacio del usuario</text><text class="cd l-neutral" x="678" y="348">selected local directory</text><text class="it l-en" x="678" y="373">files · child jobs · local HTTP</text><text class="it l-es" x="678" y="373">archivos · procesos · HTTP local</text><text class="mu l-en" x="678" y="398">Outside static deployment</text><text class="mu l-es" x="678" y="398">Fuera del sitio público</text></g>
  <path class="flow flow-hi" d="M224 360 H238" marker-end="url(#lanes-flow)"/><text class="lbl l-en" x="222" y="294">request</text><text class="lbl l-es" x="222" y="294">solicitud</text>
  <path class="flow" d="M436 360 H450" marker-end="url(#lanes-flow)"/><text class="lbl l-en" x="432" y="294">typed plan</text><text class="lbl l-es" x="432" y="294">plan tipado</text>
  <path class="flow" d="M648 360 H662" marker-end="url(#lanes-flow)"/><text class="lbl l-en" x="642" y="294">admitted effects</text><text class="lbl l-es" x="642" y="294">efectos admitidos</text>

  <rect class="lane" x="18" y="460" width="844" height="206" rx="12"/>
  <text class="lane-title l-en" x="34" y="485">OFFLINE · TRAINING, HELD-OUT EVALUATION, EXPORT</text><text class="lane-title l-es" x="34" y="485">FUERA DE LÍNEA · AJUSTE, EVALUACIÓN RESERVADA Y EXPORTACIÓN</text>
  <g><rect class="bx" x="34" y="504" width="244" height="122" rx="8"/><text class="ttl l-en" x="48" y="529">Grouped observations</text><text class="ttl l-es" x="48" y="529">Observaciones agrupadas</text><text class="cd l-neutral" x="48" y="549">data-pipeline/pipeline/</text><text class="it l-en" x="48" y="575">train · validation · calibration</text><text class="it l-es" x="48" y="575">ajuste · validación · calibración</text><text class="mu l-en" x="48" y="602">Test cases remain held out</text><text class="mu l-es" x="48" y="602">Los casos de prueba quedan aparte</text></g>
  <g><rect class="bx bx-eng" x="318" y="504" width="244" height="122" rx="8"/><text class="ttl l-en" x="332" y="529">Fit and evaluate</text><text class="ttl l-es" x="332" y="529">Ajustar y evaluar</text><text class="cd l-neutral" x="332" y="549">learning/train.py · evaluation/runner.py</text><text class="it l-en" x="332" y="575">same tools · independent predicates</text><text class="it l-es" x="332" y="575">mismas herramientas · predicados aparte</text><text class="mu l-en" x="332" y="602">Seeds and failures are retained</text><text class="mu l-es" x="332" y="602">Se conservan semillas y fallos</text></g>
  <g><rect class="bx bx-store" x="602" y="504" width="244" height="122" rx="8"/><text class="ttl l-en" x="616" y="529">Versioned outputs</text><text class="ttl l-es" x="616" y="529">Salidas versionadas</text><text class="cd l-neutral" x="616" y="549">checkpoints · report.json · index.json</text><text class="it l-en" x="616" y="575">hashes · metrics · readiness</text><text class="it l-es" x="616" y="575">hashes · métricas · preparación</text><text class="mu l-en" x="616" y="602">Only explicit exports are published</text><text class="mu l-es" x="616" y="602">Solo se publican exportaciones explícitas</text></g>
  <path class="flow flow-hi" d="M278 565 H314" marker-end="url(#lanes-flow)"/><text class="lbl l-en" x="278" y="495">grouped splits</text><text class="lbl l-es" x="278" y="495">particiones agrupadas</text>
  <path class="flow" d="M562 565 H598" marker-end="url(#lanes-flow)"/><text class="lbl l-en" x="563" y="495">fitted state + outcomes</text><text class="lbl l-es" x="563" y="495">modelo + resultados</text>
  <path class="flow flow-hi" d="M724 504 V468 H552 V422" marker-end="url(#lanes-flow)"/><text class="lbl l-en" x="602" y="456">verified checkpoint</text><text class="lbl l-es" x="602" y="456">modelo verificado</text>
  <text class="mu l-en" x="34" y="688">Evidence may be served publicly; operator files, credentials and effects never enter the public bundle.</text>
  <text class="mu l-es" x="34" y="688">La evidencia puede ser pública; archivos, credenciales y efectos del operador quedan fuera del paquete público.</text>
</svg>
