<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 455" role="img"><title>Three execution lanes, one evidence boundary / Tres modos y un límite de evidencia</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.bx-web{fill:var(--color-accent-soft);stroke:var(--color-accent)}.bx-eng{stroke:var(--color-accent-2)}.bx-gate{stroke:var(--color-warn)}.bx-store{stroke:var(--color-magenta)}text{font-family:var(--font-sans);fill:var(--color-fg)}.ttl{font-size:12.5px;font-weight:600}.mono{font-family:var(--font-mono);font-size:9.5px;fill:var(--color-fg-subtle)}.items{font-size:10.5px}.sub{font-size:10px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.label{font-size:9.5px;fill:var(--color-fg-faint)}.head{font-size:17px;font-weight:650}</style><defs><marker id="02-lanes-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--color-accent)"/></marker></defs><text class="head l-en" x="20" y="32">Three execution lanes, one evidence boundary</text><text class="head l-es" x="20" y="32">Tres modos y un límite de evidencia</text><text class="sub l-en" x="20" y="53">Explicit responsibilities, observable transitions and declared limits</text><text class="sub l-es" x="20" y="53">Responsabilidades explícitas, transiciones observables y límites</text><g><rect class="bx bx-web" x="20" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="101">Browser live</text><text class="ttl l-es" x="34" y="101">Navegador en vivo</text><text class="mono l-neutral" x="34" y="124">src/lib/simulator.ts</text><text class="items l-en" x="34" y="153">M01 / M02 virtual workspace</text><text class="items l-es" x="34" y="153">espacio virtual M01 / M02</text><text class="sub l-en" x="34" y="179">no host files or processes</text><text class="sub l-es" x="34" y="179">sin archivos ni procesos del equipo</text><text class="label l-neutral" x="34" y="198">01</text></g><g><rect class="bx bx-gate" x="306" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="101">Authenticated native</text><text class="ttl l-es" x="320" y="101">Nativo autenticado</text><text class="mono l-neutral" x="320" y="124">reflexmesh/server.py</text><text class="items l-en" x="320" y="153">same-origin bearer; registered cases</text><text class="items l-es" x="320" y="153">bearer del mismo origen; casos registrados</text><text class="sub l-en" x="320" y="179">real disposable effects</text><text class="sub l-es" x="320" y="179">efectos reales desechables</text><text class="label l-neutral" x="320" y="198">02</text></g><g><rect class="bx bx-eng" x="592" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="101">Offline fitting</text><text class="ttl l-es" x="606" y="101">Ajuste fuera de línea</text><text class="mono l-neutral" x="606" y="124">reflexmesh/learning/train.py</text><text class="items l-en" x="606" y="153">train + calibration + model export</text><text class="items l-es" x="606" y="153">entrenar + calibrar + exportar</text><text class="sub l-en" x="606" y="179">not run by page visits</text><text class="sub l-es" x="606" y="179">no se ejecuta al visitar páginas</text><text class="label l-neutral" x="606" y="198">03</text></g><g><rect class="bx bx-eng" x="20" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="285">Held-out execution</text><text class="ttl l-es" x="34" y="285">Ejecución reservada</text><text class="mono l-neutral" x="34" y="308">reflexmesh/evaluation/runner.py</text><text class="items l-en" x="34" y="337">paired cases; effect predicates</text><text class="items l-es" x="34" y="337">casos emparejados; predicados de efecto</text><text class="sub l-en" x="34" y="363">failures remain in evidence</text><text class="sub l-es" x="34" y="363">los fallos permanecen registrados</text><text class="label l-neutral" x="34" y="382">04</text></g><g><rect class="bx bx-store" x="306" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="285">Canonical artifacts</text><text class="ttl l-es" x="320" y="285">Artefactos canónicos</text><text class="mono l-neutral" x="320" y="308">data/derived/index.json</text><text class="items l-en" x="320" y="337">episodes + hashes + aggregate metrics</text><text class="items l-es" x="320" y="337">episodios + hashes + métricas</text><text class="sub l-en" x="320" y="363">immutable measured records</text><text class="sub l-es" x="320" y="363">registros medidos inmutables</text><text class="label l-neutral" x="320" y="382">05</text></g><g><rect class="bx bx-web" x="592" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="285">Static replay</text><text class="ttl l-es" x="606" y="285">Reproducción estática</text><text class="mono l-neutral" x="606" y="308">src/api/artifacts.ts</text><text class="items l-en" x="606" y="337">fetch + validate + cursor playback</text><text class="items l-es" x="606" y="337">cargar + validar + reproducir</text><text class="sub l-en" x="606" y="363">never redispatch effects</text><text class="sub l-es" x="606" y="363">nunca repetir efectos</text><text class="label l-neutral" x="606" y="382">06</text></g><path class="flow" d="M724,210 L724,237 L152,237 L152,258" marker-end="url(#02-lanes-arrow)"/><path class="flow" d="M438,210 L438,224 L152,224 L152,258" marker-end="url(#02-lanes-arrow)"/><path class="flow" d="M286,328 L304,328" marker-end="url(#02-lanes-arrow)"/><path class="flow" d="M572,328 L590,328" marker-end="url(#02-lanes-arrow)"/><path class="flow" d="M152,210 L152,218 L868,218 L868,328 L859,328" marker-end="url(#02-lanes-arrow)"/><text class="sub l-en" x="20" y="432">Recorded evidence flows forward; new effects require fresh admission</text><text class="sub l-es" x="20" y="432">La evidencia avanza; los efectos nuevos requieren admisión vigente</text></svg>