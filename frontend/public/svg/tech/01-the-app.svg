<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 650" role="img">
  <title>Neuraxis software-control loop / Ciclo de control de software de Neuraxis</title>
  <style>
    svg .l-es{display:none} svg .l-en{display:block}
    [data-arch-lang="es"] svg .l-en{display:none} [data-arch-lang="es"] svg .l-es{display:block}
    .bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.4}
    .bx-hi{fill:var(--color-accent-soft);stroke:var(--color-accent);stroke-width:2}
    .bx-eng{stroke:var(--color-good);stroke-width:1.7}
    .bx-gate{fill:var(--color-accent-soft);stroke:var(--color-warn);stroke-width:1.8}
    .bx-store{stroke:var(--color-accent-2);stroke-width:1.7}
    .lane{fill:var(--color-surface);stroke:var(--color-border);stroke-width:1}
    text{font-family:var(--font-sans);fill:var(--color-fg)}
    .head{font-size:18px;font-weight:700}.lane-title{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--color-fg-subtle)}
    .sub{font-size:11px;fill:var(--color-fg-subtle)}.ttl{font-size:14px;font-weight:650}.it{font-size:12px}.cd,.mono{font-family:var(--font-mono);font-size:10.5px;fill:var(--color-accent)}
    .mu{font-size:11px;fill:var(--color-fg-subtle)}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.7}
    .flow-accent{stroke:var(--color-accent)}.flow-gate{stroke:var(--color-warn)}.lbl{font-size:10.5px;fill:var(--color-fg-subtle)}
  </style>
  <defs><marker id="app-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-accent)"/></marker></defs>
  <text class="head l-en" x="24" y="34">A closed loop with a separate authority boundary</text>
  <text class="head l-es" x="24" y="34">Un ciclo cerrado con un límite de autoridad independiente</text>
  <text class="mu l-en" x="24" y="57">Every action begins with current observations and returns through verified outcome evidence.</text>
  <text class="mu l-es" x="24" y="57">Cada acción parte de observaciones vigentes y vuelve mediante evidencia de resultados verificados.</text>
  <rect class="lane" x="18" y="76" width="844" height="184" rx="12"/>
  <text class="lane-title l-en" x="34" y="99">OBSERVE · MAINTAIN STATE · SELECT A POLICY</text>
  <text class="lane-title l-es" x="34" y="99">OBSERVAR · MANTENER ESTADO · ELEGIR POLÍTICA</text>
  <g>
    <rect class="bx bx-hi" x="34" y="116" width="248" height="118" rx="9"/>
    <text class="ttl l-en" x="49" y="142">Observed workspace</text><text class="ttl l-es" x="49" y="142">Espacio de trabajo observado</text>
    <text class="cd l-neutral" x="49" y="164">environments/software.py</text>
    <text class="it l-en" x="49" y="190">files · processes · local HTTP</text><text class="it l-es" x="49" y="190">archivos · procesos · HTTP local</text>
    <text class="mu l-en" x="49" y="214">Observed bytes and process state</text><text class="mu l-es" x="49" y="214">Bytes y procesos observados</text>
  </g>
  <g>
    <rect class="bx bx-eng" x="316" y="116" width="248" height="118" rx="9"/>
    <text class="ttl l-en" x="331" y="142">Persistent causal state</text><text class="ttl l-es" x="331" y="142">Estado causal persistente</text>
    <text class="cd l-neutral" x="331" y="164">controller.py · runtime.py</text>
    <text class="it l-en" x="331" y="190">resource revisions · pending effects</text><text class="it l-es" x="331" y="190">revisiones · efectos pendientes</text>
    <text class="mu l-en" x="331" y="214">Unknown remains unresolved</text><text class="mu l-es" x="331" y="214">Lo desconocido sigue sin resolver</text>
  </g>
  <g>
    <rect class="bx bx-eng" x="598" y="116" width="248" height="118" rx="9"/>
    <text class="ttl l-en" x="613" y="142">Policy arbitration</text><text class="ttl l-es" x="613" y="142">Arbitraje de políticas</text>
    <text class="cd l-neutral" x="613" y="164">policies/ · learning/gate.py</text>
    <text class="it l-en" x="613" y="190">act · observe · wait · delegate</text><text class="it l-es" x="613" y="190">actuar · observar · esperar · delegar</text>
    <text class="mu l-en" x="613" y="214">Scores rank; they never authorize</text><text class="mu l-es" x="613" y="214">Los puntajes ordenan, no autorizan</text>
  </g>
  <path class="flow flow-accent" d="M282 175 H312" marker-end="url(#app-flow)"/>
  <text class="lbl l-en" x="284" y="111">typed events</text><text class="lbl l-es" x="284" y="111">eventos tipados</text>
  <path class="flow flow-accent" d="M564 175 H594" marker-end="url(#app-flow)"/>
  <text class="lbl l-en" x="565" y="111">state + budget</text><text class="lbl l-es" x="565" y="111">estado + presupuesto</text>

  <rect class="lane" x="18" y="282" width="844" height="184" rx="12"/>
  <text class="lane-title l-en" x="34" y="305">ADMIT · EXECUTE · VERIFY</text><text class="lane-title l-es" x="34" y="305">ADMITIR · EJECUTAR · VERIFICAR</text>
  <g>
    <rect class="bx bx-store" x="34" y="322" width="248" height="118" rx="9"/>
    <text class="ttl l-en" x="49" y="348">Outcome evidence</text><text class="ttl l-es" x="49" y="348">Evidencia del resultado</text>
    <text class="cd l-neutral" x="49" y="370">evaluation/runner.py</text>
    <text class="it l-en" x="49" y="396">predicate · duration · status</text><text class="it l-es" x="49" y="396">predicado · duración · estado</text>
    <text class="mu l-en" x="49" y="420">Success requires observed postconditions</text><text class="mu l-es" x="49" y="420">El éxito exige postcondiciones observadas</text>
  </g>
  <g>
    <rect class="bx bx-eng" x="316" y="322" width="248" height="118" rx="9"/>
    <text class="ttl l-en" x="331" y="348">Registered effectors</text><text class="ttl l-es" x="331" y="348">Ejecutores registrados</text>
    <text class="cd l-neutral" x="331" y="370">runtime.py · effectors.py</text>
    <text class="it l-en" x="331" y="396">typed args · idempotency · receipts</text><text class="it l-es" x="331" y="396">argumentos · idempotencia · recibos</text>
    <text class="mu l-en" x="331" y="420">Uncertain effects require reconciliation</text><text class="mu l-es" x="331" y="420">Efectos inciertos requieren conciliación</text>
  </g>
  <g>
    <rect class="bx bx-gate" x="598" y="322" width="248" height="118" rx="9"/>
    <text class="ttl l-en" x="613" y="348">Native admission broker</text><text class="ttl l-es" x="613" y="348">Intermediario de admisión nativo</text>
    <text class="cd l-neutral" x="613" y="370">rust/core.rs · contracts.rs</text>
    <text class="it l-en" x="613" y="396">capability · revision · cancellation</text><text class="it l-es" x="613" y="396">capacidad · revisión · cancelación</text>
    <text class="mu l-en" x="613" y="420">Rechecks before each mutation</text><text class="mu l-es" x="613" y="420">Revalida antes de cada mutación</text>
  </g>
  <path class="flow flow-accent" d="M722 234 V318" marker-end="url(#app-flow)"/>
  <text class="lbl l-en" x="732" y="277">candidate + binding</text><text class="lbl l-es" x="732" y="277">candidato + vínculo</text>
  <path class="flow flow-gate" d="M598 381 H568" marker-end="url(#app-flow)"/>
  <text class="lbl l-en" x="565" y="317">admitted effect</text><text class="lbl l-es" x="565" y="317">efecto admitido</text>
  <path class="flow" d="M316 381 H286" marker-end="url(#app-flow)"/>
  <text class="lbl l-en" x="286" y="317">observed result</text><text class="lbl l-es" x="286" y="317">resultado observado</text>

  <path class="flow flow-accent" d="M34 450 V548 H158 V238" marker-end="url(#app-flow)"/>
  <text class="lbl l-en" x="174" y="528">verified outcome and fresh resource revisions start the next cycle</text>
  <text class="lbl l-es" x="174" y="528">el resultado y las revisiones vigentes inician el ciclo siguiente</text>
  <rect class="bx" x="174" y="568" width="532" height="48" rx="8"/>
  <text class="it l-en" x="194" y="598">Authority is enforced at execution; learning only changes which admissible proposal is preferred.</text>
  <text class="it l-es" x="194" y="598">La autoridad se aplica al ejecutar; el aprendizaje solo cambia la preferencia entre propuestas permitidas.</text>
</svg>
