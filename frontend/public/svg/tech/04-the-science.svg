<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 455" role="img"><title>Learning is separated from frozen evaluation / Aprendizaje separado de evaluación</title><style>svg .l-es{display:none}svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1}.bx-web{fill:var(--color-accent-soft);stroke:var(--color-accent)}.bx-eng{stroke:var(--color-accent-2)}.bx-gate{stroke:var(--color-warn)}.bx-store{stroke:var(--color-magenta)}text{font-family:var(--font-sans);fill:var(--color-fg)}.ttl{font-size:12.5px;font-weight:600}.mono{font-family:var(--font-mono);font-size:9.5px;fill:var(--color-fg-subtle)}.items{font-size:10.5px}.sub{font-size:10px;fill:var(--color-fg-subtle)}.flow{stroke:var(--color-accent);stroke-width:1.5;fill:none}.label{font-size:9.5px;fill:var(--color-fg-faint)}.head{font-size:17px;font-weight:650}</style><defs><marker id="04-the-science-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--color-accent)"/></marker></defs><text class="head l-en" x="20" y="32">Learning is separated from frozen evaluation</text><text class="head l-es" x="20" y="32">Aprendizaje separado de evaluación</text><text class="sub l-en" x="20" y="53">Explicit responsibilities, observable transitions and declared limits</text><text class="sub l-es" x="20" y="53">Responsabilidades explícitas, transiciones observables y límites</text><g><rect class="bx bx-store" x="20" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="101">Collect transitions</text><text class="ttl l-es" x="34" y="101">Recolectar transiciones</text><text class="mono l-neutral" x="34" y="124">reflexmesh/learning/dataset.py</text><text class="items l-en" x="34" y="153">success + failure + exploratory action</text><text class="items l-es" x="34" y="153">éxito + fallo + acción exploratoria</text><text class="sub l-en" x="34" y="179">causal observations only</text><text class="sub l-es" x="34" y="179">solo observaciones causales</text><text class="label l-neutral" x="34" y="198">01</text></g><g><rect class="bx bx-gate" x="306" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="101">Group before fitting</text><text class="ttl l-es" x="320" y="101">Agrupar antes de ajustar</text><text class="mono l-neutral" x="320" y="124">reflexmesh/pipeline.py</text><text class="items l-en" x="320" y="153">train / validation / calibration / test</text><text class="items l-es" x="320" y="153">ajuste / validación / calibración / prueba</text><text class="sub l-en" x="320" y="179">no event-row leakage</text><text class="sub l-es" x="320" y="179">sin filtración por filas de eventos</text><text class="label l-neutral" x="320" y="198">02</text></g><g><rect class="bx bx-eng" x="592" y="76" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="101">Fit policy engines</text><text class="ttl l-es" x="606" y="101">Ajustar políticas</text><text class="mono l-neutral" x="606" y="124">reflexmesh/learning/train.py</text><text class="items l-en" x="606" y="153">linear / tree / GRU / PPO / model</text><text class="items l-es" x="606" y="153">lineal / árbol / GRU / PPO / modelo</text><text class="sub l-en" x="606" y="179">actual checkpoints required</text><text class="sub l-es" x="606" y="179">requiere modelos entrenados reales</text><text class="label l-neutral" x="606" y="198">03</text></g><g><rect class="bx bx-eng" x="20" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="34" y="285">Calibrate and freeze</text><text class="ttl l-es" x="34" y="285">Calibrar y congelar</text><text class="mono l-neutral" x="34" y="308">reflexmesh/policies/</text><text class="items l-en" x="34" y="337">explicit probability target + hashes</text><text class="items l-es" x="34" y="337">objetivo probabilístico + hashes</text><text class="sub l-en" x="34" y="363">not a safety certificate</text><text class="sub l-es" x="34" y="363">no es certificado de seguridad</text><text class="label l-neutral" x="34" y="382">04</text></g><g><rect class="bx bx-gate" x="306" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="320" y="285">Evaluate effects</text><text class="ttl l-es" x="320" y="285">Evaluar efectos</text><text class="mono l-neutral" x="320" y="308">reflexmesh/evaluation/runner.py</text><text class="items l-en" x="320" y="337">same tools; independent predicates</text><text class="items l-es" x="320" y="337">mismas herramientas; predicados independientes</text><text class="sub l-en" x="320" y="363">cost + latency + success</text><text class="sub l-es" x="320" y="363">costo + latencia + éxito</text><text class="label l-neutral" x="320" y="382">05</text></g><g><rect class="bx bx-web" x="592" y="260" width="266" height="134" rx="8"/><text class="ttl l-en" x="606" y="285">Compare and ablate</text><text class="ttl l-es" x="606" y="285">Comparar y retirar módulos</text><text class="mono l-neutral" x="606" y="308">src/pages/Benchmark.tsx</text><text class="items l-en" x="606" y="337">variants / confusion / calibration</text><text class="items l-es" x="606" y="337">variantes / confusión / calibración</text><text class="sub l-en" x="606" y="363">measured evidence only</text><text class="sub l-es" x="606" y="363">solo evidencia medida</text><text class="label l-neutral" x="606" y="382">06</text></g><path class="flow" d="M286,144 L304,144" marker-end="url(#04-the-science-arrow)"/><path class="flow" d="M572,144 L590,144" marker-end="url(#04-the-science-arrow)"/><path class="flow" d="M724,210 L724,238 L152,238 L152,258" marker-end="url(#04-the-science-arrow)"/><path class="flow" d="M286,328 L304,328" marker-end="url(#04-the-science-arrow)"/><path class="flow" d="M572,328 L590,328" marker-end="url(#04-the-science-arrow)"/><text class="sub l-en" x="20" y="432">Recorded evidence flows forward; new effects require fresh admission</text><text class="sub l-es" x="20" y="432">La evidencia avanza; los efectos nuevos requieren admisión vigente</text></svg>