<svg xmlns="http://www.w3.org/2000/svg" width="880" class="arch-svg" viewBox="0 0 880 680" role="img">
  <title>Learning, action authority and measured evidence / Aprendizaje, autoridad de acción y evidencia medida</title>
  <style>
    svg .l-es{display:none} svg .l-en{display:block}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:block}
    .lane{fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.2}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.4}
    .bx-hi{fill:var(--color-accent-soft);stroke:var(--color-accent);stroke-width:1.9}.bx-eng{stroke:var(--color-good);stroke-width:1.7}
    .bx-gate{fill:var(--color-accent-soft);stroke:var(--color-warn);stroke-width:1.8}.bx-store{stroke:var(--color-accent-2);stroke-width:1.7}
    text{font-family:var(--font-sans);fill:var(--color-fg)}.head{font-size:18px;font-weight:700}.band{font-size:11px;font-weight:700;letter-spacing:.07em;fill:var(--color-fg-subtle)}
    .sub{font-size:11px;fill:var(--color-fg-subtle)}.ttl{font-size:13px;font-weight:650}.it{font-size:11.5px}.eq{font-family:var(--font-mono);font-size:11px;fill:var(--color-fg)}
    .cd,.mono{font-family:var(--font-mono);font-size:10px;fill:var(--color-accent)}.mu{font-size:10.5px;fill:var(--color-fg-subtle)}
    .flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.7}.flow-hi{stroke:var(--color-accent)}.lbl{font-size:10px;fill:var(--color-fg-subtle)}
  </style>
  <defs><marker id="science-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-accent)"/></marker></defs>
  <text class="head l-en" x="24" y="34">The learned controller is a hypothesis under measured limits</text><text class="head l-es" x="24" y="34">El controlador aprendido es una hipótesis con límites medidos</text>
  <text class="mu l-en" x="24" y="57">Training, arbitration, authority and outcome evaluation are separate operations.</text><text class="mu l-es" x="24" y="57">El ajuste, el arbitraje, la autoridad y la evaluación de resultados son operaciones separadas.</text>

  <rect class="lane" x="18" y="78" width="844" height="206" rx="12"/><text class="band l-en" x="34" y="103">BUILD AND CALIBRATE FROM GROUPED EPISODES</text><text class="band l-es" x="34" y="103">AJUSTAR Y CALIBRAR CON EPISODIOS AGRUPADOS</text>
  <g><rect class="bx bx-store" x="34" y="120" width="248" height="132" rx="9"/><text class="ttl l-en" x="49" y="146">Frozen task matrix</text><text class="ttl l-es" x="49" y="146">Matriz de tareas congelada</text><text class="cd l-neutral" x="49" y="168">data/derived/index.json</text><text class="it l-en" x="49" y="194">12 methods · 20 families · 6 variants</text><text class="it l-es" x="49" y="194">12 métodos · 20 familias · 6 variantes</text><text class="mu l-en" x="49" y="222">10 seeds; preserve every failure</text><text class="mu l-es" x="49" y="222">10 semillas; conservar cada fallo</text></g>
  <g><rect class="bx bx-eng" x="316" y="120" width="248" height="132" rx="9"/><text class="ttl l-en" x="331" y="146">Fit and freeze policies</text><text class="ttl l-es" x="331" y="146">Ajustar y congelar políticas</text><text class="cd l-neutral" x="331" y="168">pipeline/learned_comparison/</text><text class="it l-en" x="331" y="194">recurrent preference + finite lookahead</text><text class="it l-es" x="331" y="194">preferencia recurrente + anticipación finita</text><text class="mu l-en" x="331" y="222">Group split before model fitting</text><text class="mu l-es" x="331" y="222">Separar grupos antes del ajuste</text></g>
  <g><rect class="bx bx-gate" x="598" y="120" width="248" height="132" rx="9"/><text class="ttl l-en" x="613" y="146">Learn when to defer</text><text class="ttl l-es" x="613" y="146">Aprender cuándo delegar</text><text class="cd l-neutral" x="613" y="168">pipeline/learned_comparison/gate.py</text><text class="it l-en" x="613" y="194">228 training states · 7 positive labels</text><text class="it l-es" x="613" y="194">228 estados de ajuste · 7 etiquetas positivas</text><text class="mu l-en" x="613" y="222">Selected threshold 1.01: never defer</text><text class="mu l-es" x="613" y="222">Umbral 1,01: nunca delegar</text></g>
  <path class="flow flow-hi" d="M282 184 H312" marker-end="url(#science-flow)"/><text class="lbl l-en" x="282" y="111">grouped episodes</text><text class="lbl l-es" x="282" y="111">episodios agrupados</text>
  <path class="flow" d="M564 184 H594" marker-end="url(#science-flow)"/><text class="lbl l-en" x="565" y="111">paired calibration</text><text class="lbl l-es" x="565" y="111">calibración pareada</text>
  <text class="eq l-neutral" x="34" y="270">Sₜ(a) = log(pθ(a | oₜ,hₜ) + ε) + λUφ(a | oₜ),  a ∈ Aₜ</text>
  <text class="mu l-en" x="527" y="270">Ranking score, not calibrated probability or authority.</text><text class="mu l-es" x="527" y="270">Puntaje de orden, no probabilidad calibrada ni autoridad.</text>

  <rect class="lane" x="18" y="302" width="844" height="208" rx="12"/><text class="band l-en" x="34" y="327">PROPOSE · ADMIT INDEPENDENTLY · MEASURE EFFECTS</text><text class="band l-es" x="34" y="327">PROPONER · ADMITIR POR SEPARADO · MEDIR EFECTOS</text>
  <g><rect class="bx bx-hi" x="34" y="344" width="248" height="132" rx="9"/><text class="ttl l-en" x="49" y="370">Select an admissible action</text><text class="ttl l-es" x="49" y="370">Elegir una acción permitida</text><text class="cd l-neutral" x="49" y="392">policies/ · controller.py</text><text class="it l-en" x="49" y="418">recurrent state · residual · budget</text><text class="it l-es" x="49" y="418">estado recurrente · residuo · presupuesto</text><text class="mu l-en" x="49" y="446">May act, wait, observe or delegate</text><text class="mu l-es" x="49" y="446">Puede actuar, esperar, observar o delegar</text></g>
  <g><rect class="bx bx-gate" x="316" y="344" width="248" height="132" rx="9"/><text class="ttl l-en" x="331" y="370">Authority stays in the broker</text><text class="ttl l-es" x="331" y="370">Autoridad del intermediario</text><text class="cd l-neutral" x="331" y="392">rust/core.rs · contracts.rs</text><text class="eq l-neutral" x="331" y="419">Aᵃᵈᵐ = {a ∈ A : G(a) = 1}</text><text class="mu l-en" x="331" y="446">Fresh capability and revision checks</text><text class="mu l-es" x="331" y="446">Verifica capacidad y revisión vigentes</text></g>
  <g><rect class="bx bx-store" x="598" y="344" width="248" height="132" rx="9"/><text class="ttl l-en" x="613" y="370">Independent evidence disagrees</text><text class="ttl l-es" x="613" y="370">Discrepa la evidencia externa</text><text class="cd l-neutral" x="613" y="392">data/derived/ · evaluation/</text><text class="it l-en" x="613" y="418">core: M01 1200/1200 · M12 1160/1200</text><text class="it l-es" x="613" y="418">base: M01 1200/1200 · M12 1160/1200</text><text class="mu l-en" x="613" y="446">p50: 0.0219 ms vs 18.13 ms</text><text class="mu l-es" x="613" y="446">p50: 0,0219 ms frente a 18,13 ms</text></g>
  <path class="flow flow-hi" d="M282 408 H312" marker-end="url(#science-flow)"/><text class="lbl l-en" x="282" y="336">typed proposal</text><text class="lbl l-es" x="282" y="336">propuesta tipada</text>
  <path class="flow" d="M564 408 H594" marker-end="url(#science-flow)"/><text class="lbl l-en" x="565" y="336">verified effects</text><text class="lbl l-es" x="565" y="336">efectos verificados</text>
  <path class="flow flow-hi" d="M722 252 V340" marker-end="url(#science-flow)"/><text class="lbl l-en" x="733" y="298">fitted gate</text><text class="lbl l-es" x="733" y="298">umbral ajustado</text>

  <rect class="bx" x="34" y="534" width="812" height="78" rx="9"/>
  <text class="ttl l-en" x="52" y="560">Current conclusion: no demonstrated advantage</text><text class="ttl l-es" x="52" y="560">Conclusión actual: no se demuestra una ventaja</text>
  <text class="it l-en" x="52" y="586">Transfer: M04 24/24, M12 21/24. Four ablations match task success. The benchmark is too saturated to establish the allocation hypothesis.</text>
  <text class="it l-es" x="52" y="586">Transferencia: M04 24/24, M12 21/24. Cuatro ablaciones igualan el éxito. La prueba no distingue la hipótesis de asignación.</text>
  <text class="mu l-en" x="34" y="638">A useful research question is not an established result; the proposed mechanism remains falsifiable and under evaluation.</text>
  <text class="mu l-es" x="34" y="638">Una pregunta de investigación no es un resultado: el mecanismo propuesto sigue siendo refutable y está en evaluación.</text>
</svg>
