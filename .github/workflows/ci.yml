name: Neuraxis CI
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.23,<5'
      - run: python scripts/check_ci_budget.py
      - run: python scripts/check_sdd.py
      - run: python scripts/check_manuscripts.py
      - run: python scripts/check_contract_catalog.py
      - run: python scripts/check_readiness.py
      - run: python scripts/check_template_adoption.py
      - run: python scripts/check_tech_matrix.py
      - run: python scripts/check_notebooks.py
      - run: python scripts/check_readme_areas.py
      - run: python scripts/check_artifacts.py
      - run: python scripts/check_semantic_transfer.py
      - run: python scripts/check_semantic_routing.py
      - run: python scripts/check_research.py
      - run: python scripts/check_operations.py
      - run: python scripts/check_template_residue.py
      - run: python scripts/check_content_standards.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run format:check
      - working-directory: frontend
        run: npm run build
