name: Neuraxis CI
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# ADR-0074: cheap checks on committed files; no bake, no training, no browser gate. Every step runs under `bash -eo pipefail`,
# so a failing command inside a pipe fails the step (T9).
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version check compares VERSION with the latest tag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_ci_budget.py
      - name: VERSION is the single source (T4)
        run: python scripts/check_version_coherence.py
      - name: One deploy place
        run: python scripts/check_deploy_place.py
      - run: python scripts/check_sdd.py
      - run: python scripts/check_artifacts.py
      - run: python scripts/check_semantic_transfer.py
      - run: python scripts/check_semantic_routing.py
      - run: python scripts/check_research.py
      - run: python scripts/check_operations.py
      - run: python scripts/check_template_residue.py
      - name: Every path a document names exists
        run: python scripts/check_doc_paths.py
      - run: python scripts/check_content_standards.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: An animated SVG carries its reduced-motion block and plays ten seconds at most (shell 0.14.0, reuses the shell's analysis)
        run: python scripts/check_svg_animation.py
      - working-directory: frontend
        run: npm run format:check
      - working-directory: frontend
        run: npm run build
      - name: Web baseline (tokens, classes, numbers, images, animation loops)
        run: python scripts/check_web_baseline.py
      - name: Base-integrity guards (the regressions this archetype forbids)
        run: |
          fail=0
          # the tracked paths, read once. `git ls-files | grep -q` failed at random under pipefail: grep -q exits on its first
          # match, git ls-files dies of SIGPIPE and the pipeline reports 141, so a test (and its negation) flipped run to run.
          # Every test below reads the list from a here-string: no pipe, no early-closing reader.
          files="$(git ls-files)"
          # a real .env must never be tracked; an example file (.env.example, frontend/.env.example) may be
          envs="$(grep -E '(^|/)\.env(\..+)?$' <<<"$files" | grep -vE '(^|/)\.env(\..+)?\.example$' || true)"
          if [ -n "$envs" ]; then
            echo "::error::a real .env is tracked (only an .env.example may be): $(tr '\n' ' ' <<<"$envs")"; fail=1; fi
          # venvs, native binaries and heavy model blobs must never be tracked
          if grep -qiE '(^|/)\.?venv|\.(dll|so|dylib|pt|pth)$' <<<"$files"; then
            echo "::error::a venv or native/heavy binary is tracked"; fail=1; fi
          # raw or heavy data must never be tracked; commit only compact derived artifacts under data/derived/
          if grep -qiE '\.(parquet|h5|hdf5|nc|mat|npy)$' <<<"$files"; then
            echo "::error::raw or heavy data tracked; commit only compact derived artifacts (data/derived/)"; fail=1; fi
          # no leaked local machine paths in tracked sources
          if git grep -nE '[A-Z]:\\_(Repos|worktrees|Temp)|[A-Z]:/_(Repos|worktrees|Temp)' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::a local machine path in a tracked file"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
