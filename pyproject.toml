# Product repository: orchestration scripts only. The engine is the reflexmesh dependency.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# ADR-0078: the guards below are taken verbatim from the template and are not edited here. The template lints with ruff 0.15.18,
# which enables fewer rules than the 0.17.1 this product pins; each entry names the rules 0.17.1 reports on that file and nothing
# else, so a new finding in the file is still reported.
"scripts/check_sdd.py" = ["FURB167", "ISC004", "RUF100"]
"scripts/check_web_baseline.py" = ["FURB167"]
"scripts/check_doc_paths.py" = ["FURB167", "PLW1510"]
"scripts/check_svg_animation.py" = ["PLW1510"]
"scripts/check_skeleton.py" = ["RUF059"]
"scripts/check_contract_versions.py" = ["ISC004", "PLW1510", "RUF007", "RUF100"]
